name: Fetch SEC Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_sec_data.py

      - name: Probe 13F
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python probe_13f.py

      - name: Ping healthchecks.io (success)
        if: success()
        run: curl -fsS -m 10 --retry 3 https://hc-ping.com/a8c20222-9718-4f2b-a405-709a8ee85c64 > /dev/null

      - name: Ping healthchecks.io (failure)
        if: failure()
        run: curl -fsS -m 10 --retry 3 https://hc-ping.com/a8c20222-9718-4f2b-a405-709a8ee85c64/fail > /dev/null
